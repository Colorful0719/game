<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>七軍領地爭奪戰 - P2P 穩定增強版</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #020617; color: white; margin: 0; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        @keyframes scan { from { transform: translateY(-100%); } to { transform: translateY(100vh); } }
        .scan-line { position: absolute; height: 2px; width: 100%; background: linear-gradient(to right, transparent, #22d3ee, transparent); animation: scan 4s linear infinite; pointer-events: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const TEAMS = [
            { id: 'red', name: '紅龍軍', color: 'bg-red-500' },
            { id: 'blue', name: '藍鯨軍', color: 'bg-blue-500' },
            { id: 'green', name: '綠林軍', color: 'bg-green-500' },
            { id: 'yellow', name: '黃金軍', color: 'bg-yellow-500' },
            { id: 'purple', name: '紫焰軍', color: 'bg-purple-500' },
            { id: 'orange', name: '橘虎軍', color: 'bg-orange-500' },
            { id: 'cyan', name: '青羽軍', color: 'bg-cyan-500' },
        ];

        const QUESTIONS = [
            { q: "HTML 中連結的標籤是？", a: ["<link>", "<a>", "<img>"], c: 1 },
            { q: "哪一個是前端框架？", a: ["Django", "React", "Laravel"], c: 1 },
            { q: "JavaScript 宣告常數用？", a: ["let", "var", "const"], c: 2 },
            { q: "1KB 等於多少 Byte？", a: ["1000", "1024", "2048"], c: 1 },
        ];

        // Google 公共 STUN 伺服器，協助穿透防火牆
        const PEER_CONFIG = {
            config: {
                'iceServers': [
                    { url: 'stun:stun.l.google.com:19302' },
                    { url: 'stun:stun1.l.google.com:19302' },
                    { url: 'stun:stun2.l.google.com:19302' }
                ]
            }
        };

        function App() {
            const [mode, setMode] = useState(null);
            const [peerId, setPeerId] = useState('');
            const [targetId, setTargetId] = useState('');
            const [grid, setGrid] = useState(Array(100).fill(null));
            const [userName, setUserName] = useState('');
            const [myTeam, setMyTeam] = useState(null);
            const [isReady, setIsReady] = useState(false);
            const [cooldown, setCooldown] = useState(0);
            const [showQuiz, setShowQuiz] = useState(null);
            const [status, setStatus] = useState('初始化中...');
            
            const peerRef = useRef(null);
            const connsRef = useRef([]);

            // 老師端初始化
            useEffect(() => {
                if (mode === 'host') {
                    const peer = new Peer(PEER_CONFIG);
                    peerRef.current = peer;

                    peer.on('open', id => {
                        setPeerId(id);
                        setStatus('系統已就緒，請分享 ID 給學生');
                    });

                    peer.on('connection', conn => {
                        connsRef.current.push(conn);
                        conn.on('open', () => {
                            conn.send({ type: 'SYNC', grid });
                        });
                        conn.on('data', data => {
                            if (data.type === 'CAPTURE') {
                                setGrid(prev => {
                                    const next = [...prev];
                                    next[data.index] = { team: data.teamId, owner: data.name };
                                    connsRef.current.forEach(c => {
                                        if (c.open) c.send({ type: 'SYNC', grid: next });
                                    });
                                    return next;
                                });
                            }
                        });
                    });
                }
            }, [mode]);

            // 學生端連線
            const connect = () => {
                const peer = new Peer(PEER_CONFIG);
                peerRef.current = peer;
                setStatus('連線中...');

                peer.on('open', () => {
                    const conn = peer.connect(targetId);
                    conn.on('open', () => {
                        connsRef.current = [conn];
                        setIsReady(true);
                        setStatus('連線成功');
                    });
                    conn.on('data', data => {
                        if (data.type === 'SYNC') setGrid(data.grid);
                    });
                    conn.on('error', () => setStatus('連線失敗，請檢查 ID'));
                });
            };

            const handleAnswer = (idx) => {
                if (idx === showQuiz.c) {
                    const index = Math.floor(Math.random() * 100);
                    connsRef.current[0]?.send({ type: 'CAPTURE', index, teamId: myTeam.id, name: userName });
                    setCooldown(3);
                } else {
                    setCooldown(8);
                }
                setShowQuiz(null);
            };

            useEffect(() => {
                if (cooldown > 0) {
                    const t = setTimeout(() => setCooldown(cooldown - 1), 1000);
                    return () => clearTimeout(t);
                }
            }, [cooldown]);

            if (!mode) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-slate-950 p-6">
                        <div className="glass p-10 rounded-3xl w-full max-w-sm text-center space-y-6">
                            <h1 className="text-3xl font-black text-cyan-400 italic">七軍領地戰</h1>
                            <div className="space-y-4">
                                <button onClick={() => setMode('host')} className="w-full py-4 bg-indigo-600 rounded-xl font-bold">我是老師 (顯示大螢幕)</button>
                                <button onClick={() => setMode('client')} className="w-full py-4 bg-white text-black rounded-xl font-bold">我是學生 (加入遊戲)</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (mode === 'host') {
                return (
                    <div className="min-h-screen p-6 bg-slate-950 flex flex-col">
                        <div className="flex justify-between items-start mb-6">
                            <div>
                                <h1 className="text-3xl font-black text-cyan-400">戰略大螢幕</h1>
                                <p className="text-sm text-slate-400">{status}</p>
                            </div>
                            <div className="glass p-4 rounded-xl text-right">
                                <p className="text-xs text-slate-400 uppercase font-bold">學生加入 ID:</p>
                                <p className="text-2xl font-mono font-bold text-white select-all">{peerId || '產生中...'}</p>
                            </div>
                        </div>
                        <div className="flex-1 flex items-center justify-center">
                            <div className="grid grid-cols-10 gap-1 aspect-square w-full max-w-[600px] relative glass p-2">
                                <div className="scan-line"></div>
                                {grid.map((c, i) => (
                                    <div key={i} className={`rounded-sm transition-all duration-500 ${c ? TEAMS.find(t => t.id === c.team).color : 'bg-slate-900'}`}></div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            if (mode === 'client' && !isReady) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6">
                        <div className="glass p-8 rounded-3xl w-full max-w-sm space-y-4">
                            <h2 className="text-xl font-bold">連線至老師</h2>
                            <p className="text-sm text-slate-400">{status}</p>
                            <input value={targetId} onChange={e => setTargetId(e.target.value)} placeholder="輸入老師畫面的 ID" className="w-full p-4 bg-slate-900 rounded-xl outline-none border border-slate-700 text-center font-mono" />
                            <button onClick={connect} className="w-full py-4 bg-cyan-600 rounded-xl font-bold">確認連線</button>
                        </div>
                    </div>
                );
            }

            if (mode === 'client' && !myTeam) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 space-y-6">
                        <h2 className="text-2xl font-bold">輸入姓名並選組</h2>
                        <input value={userName} onChange={e => setUserName(e.target.value)} placeholder="你的名字" className="w-full max-w-xs p-4 bg-slate-900 rounded-xl text-center outline-none" />
                        <div className="grid grid-cols-2 gap-2 w-full max-w-xs">
                            {TEAMS.map(t => (
                                <button key={t.id} onClick={() => userName.length >= 2 && setMyTeam(t)} className={`${t.color} py-3 rounded-lg text-sm font-bold shadow-lg`}>{t.name}</button>
                            ))}
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-slate-950">
                    <div className={`${myTeam?.color} p-4 text-center font-bold text-white shadow-xl`}>
                        {userName} - {myTeam?.name}
                    </div>
                    <div className="flex-1 flex items-center justify-center">
                        <button 
                            onClick={() => setShowQuiz(QUESTIONS[Math.floor(Math.random()*QUESTIONS.length)])} 
                            disabled={cooldown > 0 || !!showQuiz} 
                            className={`w-56 h-56 rounded-full font-black text-2xl transition-all shadow-2xl
                            ${cooldown > 0 ? 'bg-slate-800' : myTeam?.color + ' animate-pulse active:scale-95'}`}>
                            {cooldown > 0 ? cooldown : '出擊佔領'}
                        </button>
                    </div>

                    {showQuiz && (
                        <div className="fixed inset-0 bg-black/90 flex items-center justify-center p-6 z-50">
                            <div className="bg-white text-slate-900 w-full max-w-sm rounded-3xl p-8 space-y-4">
                                <h3 className="text-xl font-bold">{showQuiz.q}</h3>
                                {showQuiz.a.map((ans, i) => (
                                    <button key={i} onClick={() => handleAnswer(i)} className="w-full p-4 text-left border-2 rounded-xl font-bold hover:bg-slate-100">{ans}</button>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
