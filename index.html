<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>七軍領地爭奪戰 - 投影決戰六位數版</title>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #020617; color: white; margin: 0; overflow: hidden; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .grid-cell { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: inset 0 0 15px rgba(0,0,0,0.3); }
        .btn-active:active { transform: scale(0.92); }
        .glow-text { text-shadow: 0 0 20px rgba(34, 211, 238, 0.7); }
        @keyframes scan { from { transform: translateY(-100%); } to { transform: translateY(100vh); } }
        .scan-line { position: absolute; height: 3px; width: 100%; background: linear-gradient(to right, transparent, #22d3ee, transparent); animation: scan 5s linear infinite; pointer-events: none; z-index: 10; opacity: 0.4; }
        .timer-glow { text-shadow: 0 0 30px rgba(239, 68, 68, 0.8); }
        /* 強制正方形容器 */
        .map-container { aspect-ratio: 1 / 1; width: 100%; max-height: calc(100vh - 250px); margin: 0 auto; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const GAME_DURATION = 300; // 5分鐘
        const ID_PREFIX = "army6-"; // 用於保證 PeerJS ID 的全球唯一性
        
        const TEAMS = [
            { id: 'red', name: '紅龍軍', color: 'bg-red-500' },
            { id: 'blue', name: '藍鯨軍', color: 'bg-blue-500' },
            { id: 'green', name: '綠林軍', color: 'bg-green-500' },
            { id: 'yellow', name: '黃金軍', color: 'bg-yellow-500' },
            { id: 'purple', name: '紫焰軍', color: 'bg-purple-500' },
            { id: 'orange', name: '橘虎軍', color: 'bg-orange-500' },
            { id: 'cyan', name: '青羽軍', color: 'bg-cyan-500' },
        ];

        const QUESTIONS = [
            { q: "HTML 中連結的標籤是？", a: ["<link>", "<a>", "<img>"], c: 1 },
            { q: "JavaScript 宣告常數推薦？", a: ["let", "var", "const"], c: 2 },
            { q: "CSS 中設定文字顏色是？", a: ["color", "font-style", "text-color"], c: 0 },
            { q: "網頁設計中 #FFFFFF 是？", a: ["黑色", "灰色", "白色"], c: 2 },
            { q: "瀏覽器按下 F12 會開啟？", a: ["下載視窗", "開發者工具", "列印網頁"], c: 1 },
            { q: "1MB 等於多少 KB？", a: ["1000", "1024", "2048"], c: 1 },
            { q: "下列哪一個是前端框架？", a: ["Django", "Vue.js", "Laravel"], c: 1 },
        ];

        function App() {
            const [mode, setMode] = useState(null);
            const [clientStage, setClientStage] = useState('connect'); 
            const [peerId, setPeerId] = useState(''); // 這邊存 6 位數字
            const [targetId, setTargetId] = useState(''); 
            const [grid, setGrid] = useState(Array(100).fill(null));
            const [timeLeft, setTimeLeft] = useState(GAME_DURATION);
            const [isGameActive, setIsGameActive] = useState(true);
            const [userName, setUserName] = useState('');
            const [myTeam, setMyTeam] = useState(null);
            const [cooldown, setCooldown] = useState(0);
            const [showQuiz, setShowQuiz] = useState(null);
            const [status, setStatus] = useState('系統就緒');
            const [feedback, setFeedback] = useState(null);

            const peerRef = useRef(null);
            const connectionsRef = useRef([]);

            useEffect(() => {
                if (mode === 'host' && isGameActive) {
                    const timer = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                clearInterval(timer);
                                setIsGameActive(false);
                                connectionsRef.current.forEach(c => {
                                    if (c.open) c.send({ type: 'STOP_GAME' });
                                });
                                return 0;
                            }
                            connectionsRef.current.forEach(c => {
                                if (c.open) c.send({ type: 'SYNC_TIME', time: prev - 1 });
                            });
                            return prev - 1;
                        });
                    }, 1000);
                    return () => clearInterval(timer);
                }
            }, [mode, isGameActive]);

            useEffect(() => {
                if (mode === 'host') {
                    const random6 = Math.floor(100000 + Math.random() * 900000).toString();
                    const peer = new Peer(ID_PREFIX + random6);
                    peerRef.current = peer;
                    
                    peer.on('open', (fullId) => { 
                        setPeerId(random6); 
                        setStatus('戰場已開啟'); 
                    });
                    
                    peer.on('connection', conn => {
                        connectionsRef.current.push(conn);
                        conn.on('open', () => { 
                            conn.send({ type: 'SYNC', grid, time: timeLeft }); 
                        });
                        conn.on('data', data => {
                            if (!isGameActive) return;
                            if (data.type === 'CAPTURE') {
                                setGrid(prev => {
                                    const next = [...prev];
                                    next[data.index] = { team: data.teamId, owner: data.name };
                                    connectionsRef.current.forEach(c => {
                                        if (c.open) c.send({ type: 'SYNC', grid: next, time: timeLeft });
                                    });
                                    return next;
                                });
                            }
                        });
                    });
                }
            }, [mode]);

            const connect = () => {
                if (!targetId || targetId.length !== 6) return;
                const peer = new Peer();
                peerRef.current = peer;
                setStatus('嘗試加入戰場...');
                peer.on('open', () => {
                    const conn = peer.connect(ID_PREFIX + targetId);
                    conn.on('open', () => {
                        setStatus('連線成功');
                        setClientStage('setup');
                        connectionsRef.current = [conn];
                    });
                    conn.on('data', data => { 
                        if (data.type === 'SYNC') { setGrid(data.grid); setTimeLeft(data.time); }
                        if (data.type === 'SYNC_TIME') { setTimeLeft(data.time); }
                        if (data.type === 'STOP_GAME') { setIsGameActive(false); }
                    });
                    conn.on('error', () => setStatus('連線失敗，請檢查六位數代碼'));
                });
            };

            const handleAnswer = (idx) => {
                if (!isGameActive) return;
                const isCorrect = idx === showQuiz.c;
                if (isCorrect) {
                    setFeedback({ ok: true, msg: '✅ 正確！連擊佔領！' });
                    const randomIndex = Math.floor(Math.random() * 100);
                    if (connectionsRef.current[0]?.open) {
                        connectionsRef.current[0].send({ 
                            type: 'CAPTURE', index: randomIndex, teamId: myTeam.id, name: userName 
                        });
                    }
                    setTimeout(() => { setShowQuiz(null); setFeedback(null); }, 400); // 答對極速刷新
                } else {
                    setFeedback({ ok: false, msg: '❌ 錯誤！懲罰冷卻 5 秒' });
                    setCooldown(5);
                    setTimeout(() => { setShowQuiz(null); setFeedback(null); }, 800);
                }
            };

            useEffect(() => {
                if (cooldown > 0) {
                    const t = setTimeout(() => setCooldown(cooldown - 1), 1000);
                    return () => clearTimeout(t);
                }
            }, [cooldown]);

            const formatTime = (s) => `${Math.floor(s / 60)}:${(s % 60).toString().padStart(2, '0')}`;

            if (!mode) {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-slate-950">
                        <div className="glass p-12 rounded-[3.5rem] w-full max-w-md text-center space-y-10 border-cyan-500/20">
                            <h1 className="text-5xl font-black text-cyan-400 italic glow-text tracking-tighter">七軍領地戰</h1>
                            <div className="space-y-4">
                                <button onClick={() => setMode('host')} className="w-full py-6 bg-indigo-600 rounded-2xl font-bold text-xl text-white shadow-lg btn-active">我是老師 (開啟大螢幕)</button>
                                <button onClick={() => setMode('client')} className="w-full py-6 bg-white text-slate-900 rounded-2xl font-bold text-xl shadow-lg btn-active">我是學生 (加入遊戲)</button>
                            </div>
                        </div>
                    </div>
                );
            }

            if (mode === 'host') {
                const stats = TEAMS.map(t => ({ ...t, count: grid.filter(g => g?.team === t.id).length }))
                                   .sort((a,b) => b.count - a.count);
                const top3 = stats.slice(0, 3);

                return (
                    <div className="h-screen p-8 bg-slate-950 flex flex-col overflow-hidden relative">
                        <div className="scan-line"></div>
                        
                        <div className="flex justify-between items-center mb-8">
                            <div className="flex items-center gap-12">
                                <h1 className="text-6xl font-black text-cyan-400 italic glow-text">七軍戰略地圖</h1>
                                <div className={`px-12 py-4 rounded-3xl border-4 border-red-500 glass flex items-center gap-6 ${timeLeft < 30 ? 'animate-pulse' : ''}`}>
                                    <span className="text-2xl font-bold text-red-500 uppercase tracking-tighter">剩餘時間</span>
                                    <span className="text-6xl font-mono font-black text-white timer-glow">{formatTime(timeLeft)}</span>
                                </div>
                            </div>
                            <div className="glass px-8 py-4 rounded-3xl text-center min-w-[320px] border-cyan-500/30">
                                <p className="text-sm text-slate-400 font-black uppercase mb-1 tracking-widest">連線代碼</p>
                                <p className="text-6xl font-mono font-bold text-white tracking-[0.2em]">{peerId || '......'}</p>
                            </div>
                        </div>

                        <div className="flex-1 flex gap-10 overflow-hidden">
                            {/* 超大排行榜 */}
                            <div className="w-[35%] space-y-6 overflow-y-auto pr-4">
                                <h2 className="text-3xl font-black text-slate-400 mb-6 uppercase tracking-widest border-b-2 border-white/10 pb-2">勢力排行</h2>
                                {stats.map((s, idx) => (
                                    <div key={s.id} className="glass p-6 rounded-3xl border-l-[16px]" style={{borderLeftColor: s.color.replace('bg-', '')}}>
                                        <div className="flex justify-between text-5xl font-black mb-4">
                                            <span className="flex items-center gap-4">
                                                <span className="text-slate-600 text-3xl">#{idx+1}</span> {s.name}
                                            </span>
                                            <span className="text-cyan-400">{s.count}</span>
                                        </div>
                                        <div className="h-8 bg-slate-900 rounded-full overflow-hidden shadow-inner border border-white/5">
                                            <div className={`${s.color} h-full transition-all duration-1000 shadow-[0_0_20px_rgba(255,255,255,0.2)]`} 
                                                 style={{ width: `${(s.count / 100) * 100}%` }} />
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* 正方形地圖 */}
                            <div className="flex-1 glass rounded-[4rem] p-8 flex items-center justify-center border-white/5 shadow-2xl relative">
                                <div className="map-container">
                                    <div className="grid grid-cols-10 gap-2 w-full h-full">
                                        {grid.map((c, i) => (
                                            <div key={i} className={`grid-cell rounded-md relative group border border-white/5 ${c ? TEAMS.find(t => t.id === c.team).color : 'bg-slate-900/40'}`}>
                                                {c && (
                                                    <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                                        <span className="text-[10px] font-black text-white/50 text-center leading-none uppercase">{c.owner}</span>
                                                    </div>
                                                )}
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* 最終結算視窗 */}
                        {!isGameActive && (
                            <div className="fixed inset-0 bg-black/95 z-50 flex items-center justify-center animate-in fade-in duration-1000">
                                <div className="glass p-20 rounded-[5rem] text-center border-yellow-500/30 max-w-4xl w-full">
                                    <h2 className="text-7xl font-black text-yellow-400 italic glow-text mb-16 underline decoration-yellow-400/30">最終戰報：前三強</h2>
                                    <div className="flex justify-center items-end gap-10 mb-20">
                                        {/* 第二名 */}
                                        <div className="space-y-6">
                                            <div className={`${top3[1].color} w-36 h-56 rounded-t-3xl flex flex-col items-center justify-center shadow-2xl border-t-8 border-white/30`}>
                                                <span className="text-5xl font-black">2</span>
                                                <span className="text-xl font-bold mt-2">{top3[1].count}格</span>
                                            </div>
                                            <p className="text-2xl font-bold">{top3[1].name}</p>
                                        </div>
                                        {/* 第一名 */}
                                        <div className="space-y-6">
                                            <div className="text-7xl mb-4 animate-bounce">👑</div>
                                            <div className={`${top3[0].color} w-48 h-72 rounded-t-3xl flex flex-col items-center justify-center shadow-[0_0_70px_rgba(234,179,8,0.5)] border-t-8 border-white/50`}>
                                                <span className="text-7xl font-black">1</span>
                                                <span className="text-2xl font-bold mt-2">{top3[0].count}格</span>
                                            </div>
                                            <p className="text-4xl font-black text-yellow-400">{top3[0].name}</p>
                                        </div>
                                        {/* 第三名 */}
                                        <div className="space-y-6">
                                            <div className={`${top3[2].color} w-36 h-40 rounded-t-3xl flex flex-col items-center justify-center shadow-2xl border-t-8 border-white/20`}>
                                                <span className="text-5xl font-black">3</span>
                                                <span className="text-xl font-bold mt-2">{top3[2].count}格</span>
                                            </div>
                                            <p className="text-2xl font-bold">{top3[2].name}</p>
                                        </div>
                                    </div>
                                    <button onClick={() => window.location.reload()} className="px-16 py-6 bg-white text-black font-black rounded-3xl text-2xl hover:scale-105 transition-all active:scale-95 shadow-xl">重新開啟新戰役</button>
                                </div>
                            </div>
                        )}
                    </div>
                );
            }

            if (clientStage === 'connect') {
                return (
                    <div className="min-h-screen flex items-center justify-center p-6 bg-slate-950 text-white">
                        <div className="glass p-10 rounded-[3rem] w-full max-w-sm space-y-8">
                            <h2 className="text-2xl font-bold text-center">連線至戰情中心</h2>
                            <p className="text-center text-slate-400 text-sm">{status}</p>
                            <input value={targetId} onChange={e => setTargetId(e.target.value.replace(/\D/g,''))} 
                                maxLength={6} placeholder="輸入 6 位代碼" 
                                className="w-full p-6 bg-slate-900 rounded-2xl border-2 border-slate-700 text-center font-mono text-4xl outline-none focus:border-cyan-500" />
                            <button onClick={connect} className="w-full py-6 bg-cyan-600 rounded-2xl font-bold text-2xl shadow-lg btn-active">確認連線</button>
                        </div>
                    </div>
                );
            }

            if (clientStage === 'setup') {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center p-6 space-y-10 bg-slate-950 text-white text-center">
                        <div>
                            <h2 className="text-4xl font-black text-cyan-400 glow-text italic">軍團報到</h2>
                            <p className="text-slate-500 mt-2">輸入姓名並選擇陣營</p>
                        </div>
                        <div className="w-full max-w-xs space-y-6">
                            <input value={userName} onChange={e => setUserName(e.target.value)} placeholder="您的姓名 (1字即可)" 
                                className="w-full p-6 bg-slate-900 rounded-2xl text-center text-white border border-slate-800 outline-none text-2xl" />
                            <div className="grid grid-cols-2 gap-3">
                                {TEAMS.map(t => (
                                    <button key={t.id} 
                                        onClick={() => { if(userName.length >= 1){ setMyTeam(t); setClientStage('play'); } }} 
                                        className={`${t.color} py-5 rounded-2xl text-sm font-bold shadow-lg text-white btn-active`}>
                                        {t.name}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-slate-950 text-white">
                    <div className={`${myTeam?.color} p-5 text-center font-black shadow-xl flex justify-between px-8 text-xl items-center`}>
                        <span>{userName}</span>
                        <div className="flex items-center gap-4">
                            <span className="text-sm opacity-80 uppercase tracking-tighter">戰鬥剩餘</span>
                            <span className="font-mono text-3xl">{formatTime(timeLeft)}</span>
                        </div>
                    </div>
                    
                    <div className="flex-1 flex flex-col items-center justify-center p-6 space-y-12">
                        <button 
                            onClick={() => isGameActive && setShowQuiz(QUESTIONS[Math.floor(Math.random()*QUESTIONS.length)])} 
                            disabled={cooldown > 0 || !!showQuiz || !isGameActive} 
                            className={`w-64 h-64 rounded-full border-[12px] border-white/10 font-black text-3xl transition-all shadow-2xl btn-active flex flex-col items-center justify-center
                            ${!isGameActive ? 'bg-slate-900 opacity-20' : cooldown > 0 ? 'bg-slate-800 scale-95 opacity-50' : myTeam?.color + ' animate-pulse'}`}>
                            {!isGameActive ? (
                                <span className="uppercase text-xl">戰鬥結束</span>
                            ) : cooldown > 0 ? (
                                <>
                                    <span className="text-8xl">{cooldown}</span>
                                    <span className="text-sm mt-2 opacity-50 font-black uppercase">懲罰冷卻中</span>
                                </>
                            ) : (
                                <>
                                    <span className="text-7xl mb-2">⚔️</span>
                                    <span>出擊佔領</span>
                                </>
                            )}
                        </button>
                        
                        <div className="w-full max-w-xs space-y-4">
                            <div className="flex justify-between text-xs font-black text-slate-500 uppercase tracking-widest px-1">
                                <span>全場佔領總覽</span>
                                <span>{grid.filter(g => g !== null).length} / 100</span>
                            </div>
                            <div className="h-4 bg-slate-900 rounded-full overflow-hidden flex shadow-inner border border-white/5">
                                {TEAMS.map(t => (
                                    <div key={t.id} className={`${t.color} h-full transition-all duration-700`} 
                                         style={{ width: `${(grid.filter(g => g?.team === t.id).length / 100) * 100}%` }} />
                                ))}
                            </div>
                        </div>
                    </div>

                    {showQuiz && (
                        <div className="fixed inset-0 bg-slate-950/95 flex items-center justify-center p-6 z-50">
                            <div className="bg-white text-slate-900 w-full max-w-sm rounded-[3rem] p-10 space-y-8 shadow-2xl">
                                {!feedback ? (
                                    <>
                                        <div className="space-y-2">
                                            <span className="px-4 py-1 bg-cyan-100 text-cyan-700 text-xs font-black rounded-full uppercase">戰場指令</span>
                                            <h3 className="text-2xl font-black leading-tight">{showQuiz.q}</h3>
                                        </div>
                                        <div className="space-y-3">
                                            {showQuiz.a.map((ans, i) => (
                                                <button key={i} onClick={() => handleAnswer(i)} 
                                                    className="w-full p-5 text-left border-2 border-slate-100 rounded-2xl font-bold active:bg-slate-100 transition-colors text-lg">{ans}</button>
                                            ))}
                                        </div>
                                    </>
                                ) : (
                                    <div className="text-center py-12 space-y-6">
                                        <div className="text-9xl animate-bounce">{feedback.ok ? '✅' : '❌'}</div>
                                        <p className={`text-3xl font-black ${feedback.ok ? 'text-green-600' : 'text-red-600'}`}>{feedback.msg}</p>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
